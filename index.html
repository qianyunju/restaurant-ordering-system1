<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黔韵居贵州家常菜 - 点餐系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E53E3E',
                        secondary: '#FC8181',
                        neutral: '#FFF5F5',
                        dark: '#742A2A',
                        light: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .btn-primary { @apply bg-primary text-white px-4 py-2 rounded-full hover:bg-opacity-90 transition-all; }
            .btn-secondary { @apply bg-secondary text-dark px-4 py-2 rounded-full hover:bg-opacity-90 transition-all; }
            .btn-outline { @apply border border-primary text-primary px-4 py-2 rounded-full hover:bg-primary hover:text-white transition-all; }
            .fade-in { animation: fadeIn 0.3s ease-in-out; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .cart-pulse { animation: cartPulse 0.5s ease-in-out; }
            @keyframes cartPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        }
    </style>
    <style>
        /* 修复移动端滚动问题 */
        * {
            -webkit-overflow-scrolling: touch;
            overflow-scrolling: touch;
        }
        /* 修复购物车侧边栏在移动端的宽度 */
        @media (max-width: 640px) {
            #cart-sidebar {
                width: 100% !important;
                max-width: 300px;
            }
        }
    </style>
</head>
<body class="bg-neutral min-h-screen">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <img src="https://s41.ax1x.com/2026/05/28/pmiquXn.png" alt="黔韵居" class="h-10 w-auto rounded-full mr-3">
                <h1 class="text-lg font-bold text-dark">黔韵居贵州家常菜</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="customer-id" class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">顾客: #0000</span>
                <button id="cart-btn" class="relative p-2">
                    <i class="fa fa-shopping-cart text-xl text-primary"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-primary text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
                <button id="admin-btn" class="p-2">
                    <i class="fa fa-user-circle text-xl text-primary"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="container mx-auto px-4 py-4">
        <!-- 菜单/订单切换 -->
        <div class="flex mb-4 bg-white rounded-full shadow p-1">
            <button id="menu-tab" class="flex-1 py-2 px-3 rounded-full bg-primary text-white font-medium">菜单</button>
            <button id="order-tab" class="flex-1 py-2 px-3 rounded-full text-dark font-medium">我的订单</button>
        </div>

        <!-- 菜单页面 -->
        <div id="menu-page" class="block">
            <!-- 分类 -->
            <div class="flex overflow-x-auto pb-2 mb-4">
                <div class="category-buttons-container flex space-x-2"></div>
            </div>

            <!-- 菜品列表 -->
            <div class="grid grid-cols-2 gap-3" id="menu-items"></div>
        </div>

        <!-- 订单页面 -->
        <div id="order-page" class="hidden">
            <div id="orders-list" class="space-y-3"></div>
        </div>
    </main>

    <!-- 购物车侧边栏 -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-72 bg-white shadow-xl transform translate-x-full transition-transform z-50">
        <div class="p-4 h-full flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-dark">购物车</h2>
                <button id="close-cart" class="p-1"><i class="fa fa-times text-xl"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto py-3"></div>
            <div class="border-t pt-3">
                <div class="flex justify-between items-center mb-3">
                    <span class="font-medium">总计:</span>
                    <span id="cart-total" class="text-primary font-bold text-lg">¥0.00</span>
                </div>
                <button id="checkout-btn" class="w-full btn-primary disabled:bg-gray-300 disabled:cursor-not-allowed" disabled>去结算</button>
            </div>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-5 w-full max-w-sm mx-4 fade-in">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h2 class="text-lg font-bold text-dark">确认订单</h2>
                <button id="close-checkout" class="p-1"><i class="fa fa-times"></i></button>
            </div>
            <div class="mb-3">
                <label class="block text-dark font-medium mb-1 text-sm">桌号</label>
                <input type="number" id="table-number" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" placeholder="请输入桌号">
            </div>
            <div class="mb-3">
                <label class="block text-dark font-medium mb-1 text-sm">备注</label>
                <textarea id="order-notes" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" rows="2" placeholder="特殊需求请说明"></textarea>
            </div>
            <div class="flex justify-between items-center mb-4">
                <span class="font-medium">总计:</span>
                <span id="checkout-total" class="text-primary font-bold text-lg">¥0.00</span>
            </div>
            <div class="flex space-x-3">
                <button id="cancel-checkout" class="flex-1 btn-outline text-sm">取消</button>
                <button id="submit-order" class="flex-1 btn-primary text-sm">提交订单</button>
            </div>
        </div>
    </div>

    <!-- 管理员登录弹窗 -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-5 w-full max-w-sm mx-4 fade-in">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h2 class="text-lg font-bold text-dark">管理员登录</h2>
                <button id="close-admin-login" class="p-1"><i class="fa fa-times"></i></button>
            </div>
            <div class="mb-3">
                <label class="block text-dark font-medium mb-1 text-sm">用户名</label>
                <input type="text" id="admin-username" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" placeholder="管理员账号">
            </div>
            <div class="mb-4">
                <label class="block text-dark font-medium mb-1 text-sm">密码</label>
                <input type="password" id="admin-password" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" placeholder="管理员密码">
            </div>
            <button id="login-submit" class="w-full btn-primary">登录</button>
            <p class="text-center text-xs text-gray-500 mt-3">默认账号: admin / admin123</p>
        </div>
    </div>

    <!-- 添加分类弹窗 -->
    <div id="add-category-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-5 w-full max-w-sm mx-4 fade-in">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h2 class="text-lg font-bold text-dark">添加分类</h2>
                <button id="close-add-category" class="p-1"><i class="fa fa-times"></i></button>
            </div>
            <form id="add-category-form" class="space-y-3">
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">分类名称</label>
                    <input type="text" id="add-category-name" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" required>
                </div>
                <div class="flex space-x-3">
                    <button type="button" id="cancel-add-category" class="flex-1 btn-outline text-sm">取消</button>
                    <button type="submit" class="flex-1 btn-primary text-sm">添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加菜品弹窗 -->
    <div id="add-dish-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-5 w-full max-w-sm mx-4 fade-in">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h2 class="text-lg font-bold text-dark">添加菜品</h2>
                <button id="close-add-dish" class="p-1"><i class="fa fa-times"></i></button>
            </div>
            <form id="add-dish-form" class="space-y-3">
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">菜品名称</label>
                    <input type="text" id="add-dish-name" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" required>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">价格</label>
                    <input type="number" id="add-dish-price" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" required>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">分类</label>
                    <select id="add-dish-category" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary"></select>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">描述</label>
                    <textarea id="add-dish-description" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" rows="2"></textarea>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">图片</label>
                    <div class="flex space-x-2">
                        <input type="file" id="add-dish-image-upload" class="flex-1 border rounded px-3 py-2 text-sm" accept="image/*">
                        <button type="button" id="add-dish-image-url-btn" class="btn-outline text-sm">使用URL</button>
                    </div>
                    <input type="url" id="add-dish-image-url" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary mt-2 hidden" placeholder="输入图片URL">
                </div>
                <div class="flex space-x-3">
                    <button type="button" id="cancel-add-dish" class="flex-1 btn-outline text-sm">取消</button>
                    <button type="submit" class="flex-1 btn-primary text-sm">添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑菜品弹窗 -->
    <div id="edit-dish-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-5 w-full max-w-sm mx-4 fade-in">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h2 class="text-lg font-bold text-dark">编辑菜品</h2>
                <button id="close-edit-dish" class="p-1"><i class="fa fa-times"></i></button>
            </div>
            <form id="edit-dish-form" class="space-y-3">
                <input type="hidden" id="edit-dish-id">
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">菜品名称</label>
                    <input type="text" id="edit-dish-name" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" required>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">价格</label>
                    <input type="number" id="edit-dish-price" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" required>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">分类</label>
                    <select id="edit-dish-category" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary"></select>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">描述</label>
                    <textarea id="edit-dish-description" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" rows="2"></textarea>
                </div>
                <div>
                    <label class="block text-dark font-medium mb-1 text-sm">图片</label>
                    <div class="flex space-x-2">
                        <input type="file" id="edit-dish-image-upload" class="flex-1 border rounded px-3 py-2 text-sm" accept="image/*">
                        <button type="button" id="edit-dish-image-url-btn" class="btn-outline text-sm">使用URL</button>
                    </div>
                    <input type="url" id="edit-dish-image-url" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary mt-2 hidden" placeholder="输入图片URL">
                </div>
                <div class="flex space-x-3">
                    <button type="button" id="cancel-edit-dish" class="flex-1 btn-outline text-sm">取消</button>
                    <button type="submit" class="flex-1 btn-primary text-sm">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 管理端页面 -->
    <div id="admin-page" class="hidden fixed inset-0 bg-white z-40 overflow-y-auto">
        <div class="p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-dark">管理中心</h2>
                <button id="admin-logout-btn" class="btn-outline text-sm">返回点餐端</button>
            </div>
            <div class="flex mb-4 bg-white rounded-full shadow p-1">
                <button id="dish-tab" class="flex-1 py-2 px-2 rounded-full bg-primary text-white text-sm font-medium">菜品管理</button>
                <button id="category-tab" class="flex-1 py-2 px-2 rounded-full text-dark text-sm font-medium">分类管理</button>
                <button id="admin-order-tab" class="flex-1 py-2 px-2 rounded-full text-dark text-sm font-medium">订单管理</button>
                <button id="pwd-tab" class="flex-1 py-2 px-2 rounded-full text-dark text-sm font-medium">改密码</button>
            </div>
            <!-- 菜品管理 -->
            <div id="dish-manage" class="block">
                <button id="add-dish-btn" class="btn-primary mb-3">+ 添加菜品</button>
                <div class="space-y-2" id="dish-list"></div>
            </div>
            
            <!-- 分类管理 -->
            <div id="category-manage" class="hidden">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-medium text-dark">分类列表</h3>
                    <button id="add-category-btn" class="btn-primary text-sm">+ 添加分类</button>
                </div>
                <div class="space-y-2" id="category-list"></div>
            </div>
            <!-- 订单管理 -->
            <div id="admin-order-manage" class="hidden">
                <div class="space-y-3" id="admin-order-list"></div>
            </div>
            <!-- 改密码 -->
            <div id="pwd-manage" class="hidden">
                <form id="pwd-form" class="space-y-3">
                    <div>
                        <label class="block text-dark font-medium mb-1 text-sm">当前密码</label>
                        <input type="password" id="current-pwd" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" required>
                    </div>
                    <div>
                        <label class="block text-dark font-medium mb-1 text-sm">新密码</label>
                        <input type="password" id="new-pwd" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" minlength="6" required>
                    </div>
                    <div>
                        <label class="block text-dark font-medium mb-1 text-sm">确认新密码</label>
                        <input type="password" id="confirm-pwd" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-primary" required>
                    </div>
                    <button type="submit" class="w-full btn-primary">修改密码</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 全局应用对象
        const OrderingApp = {
            config: {
                admin: JSON.parse(localStorage.getItem('admin_pwd') || '{"username":"admin","password":"admin123"}'),
                customerId: 'CUS-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                categories: JSON.parse(localStorage.getItem('categories') || '["主食","火锅","小吃","饮品"]'),
                menuItems: JSON.parse(localStorage.getItem('menuItems') || JSON.stringify([
                    {id: 1, name: '酸汤鱼', price: 48, category: '火锅', description: '贵州特色酸汤鱼，酸辣开胃', image: 'https://p11-doubao-search-sign.byteimg.com/labis/7afa565dc927aaa12027b0616cdc8c10~tplv-be4g95zd3a-image.jpeg?lk3s=feb11e32&x-expires=1795514281&x-signature=gRWVwv4YXBfXNAIsffRIdQOS7k4%3D'},
                    {id: 2, name: '辣子鸡', price: 38, category: '主食', description: '贵州辣子鸡，香辣可口', image: 'https://p3-doubao-search-sign.byteimg.com/labis/38c87bafe79f202cc2de374405180ed1~tplv-be4g95zd3a-image.jpeg?lk3s=feb11e32&x-expires=1795514281&x-signature=SGu6jq3vxgYvASc7autLsikIuGI%3D'},
                    {id: 3, name: '丝娃娃', price: 28, category: '小吃', description: '贵州特色小吃，清爽解腻', image: 'https://p26-doubao-search-sign.byteimg.com/labis/08f95d867482367bca2f95b628771f41~tplv-be4g95zd3a-image.jpeg?lk3s=feb11e32&x-expires=1795514281&x-signature=x1HbQSS%2BxNwzD7bwDiIYFF0pxtw%3D'},
                    {id: 4, name: '茅台酒', price: 88, category: '饮品', description: '贵州茅台酒，酱香浓郁', image: 'https://p26-doubao-search-sign.byteimg.com/tos-cn-i-qvj2lq49k0/0d2ea3d43cd04c58aa849f597c3deb0b~tplv-be4g95zd3a-image.jpeg?lk3s=feb11e32&x-expires=1795514281&x-signature=ypJUIABdTW2z4s98X6Ev81pl3Gw%3D'},
                    {id: 5, name: '宫保鸡丁', price: 32, category: '主食', description: '经典川菜，糊辣荔枝味', image: 'https://p11-doubao-search-sign.byteimg.com/tos-cn-i-be4g95zd3a/694739066455326747~tplv-be4g95zd3a-image.jpeg?lk3s=feb11e32&x-expires=1795514281&x-signature=aERzzxsF2IX17HMeAtuw4ESUSBI%3D'},
                    {id: 6, name: '毛肚火锅', price: 68, category: '火锅', description: '重庆毛肚火锅，麻辣鲜香', image: 'https://p3-doubao-search-sign.byteimg.com/labis/ef8e6c4953df5346a8d0d8d56ca2f6f9~tplv-be4g95zd3a-image.jpeg?lk3s=feb11e32&x-expires=1795514281&x-signature=1HyaNCudcGrw0PCU9VayAgQQAqM%3D'}
                ])),
                cart: JSON.parse(localStorage.getItem('cart') || '[]'),
                orders: JSON.parse(localStorage.getItem('orders') || '[]')
            },

            // 初始化应用
            init() {
                console.log('初始化点餐系统...');
                this.initCustomerId();
                this.bindEvents();
                this.renderMenu();
                this.renderCart();
                this.updateCategorySelectors();
                this.renderCategoryButtons();
                console.log('初始化完成！');
            },

            // 初始化顾客编号
            initCustomerId() {
                document.getElementById('customer-id').textContent = `顾客: #${this.config.customerId}`;
            },

            // 渲染菜单
            renderMenu(category = '全部') {
                const container = document.getElementById('menu-items');
                container.innerHTML = '';

                const items = category === '全部' 
                    ? this.config.menuItems 
                    : this.config.menuItems.filter(item => item.category === category);

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg shadow overflow-hidden fade-in';
                    card.innerHTML = `
                        <img src="${item.image}" class="w-full h-32 object-cover">
                        <div class="p-2">
                            <h3 class="font-medium text-dark text-sm">${item.name}</h3>
                            <p class="text-gray-500 text-xs mb-2">${item.description}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-primary font-bold">¥${item.price}</span>
                                <button class="add-to-cart btn-primary text-xs py-1 px-2" data-id="${item.id}">+ 加入</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            },

            // 渲染购物车
            renderCart() {
                const container = document.getElementById('cart-items');
                const cartCount = document.getElementById('cart-count');
                const cartTotal = document.getElementById('cart-total');
                const checkoutTotal = document.getElementById('checkout-total');
                const checkoutBtn = document.getElementById('checkout-btn');

                container.innerHTML = '';

                if (this.config.cart.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-8">购物车是空的</p>';
                    cartCount.textContent = '0';
                    cartTotal.textContent = '¥0.00';
                    checkoutTotal.textContent = '¥0.00';
                    checkoutBtn.disabled = true;
                    return;
                }

                // 计算总数量和总金额
                const totalQuantity = this.config.cart.reduce((sum, item) => sum + item.quantity, 0);
                const totalAmount = this.config.cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

                // 更新购物车数据
                this.config.cart.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'flex justify-between items-center border-b pb-2 mb-2';
                    itemEl.innerHTML = `
                        <div>
                            <p class="font-medium text-sm">${item.name}</p>
                            <p class="text-primary text-sm">¥${item.price} x ${item.quantity}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="decrease-btn px-2 py-1 border rounded text-xs" data-id="${item.id}">-</button>
                            <span class="text-sm">${item.quantity}</span>
                            <button class="increase-btn px-2 py-1 border rounded text-xs" data-id="${item.id}">+</button>
                        </div>
                    `;
                    container.appendChild(itemEl);
                });

                // 更新显示
                cartCount.textContent = totalQuantity;

            // 添加到购物车
            addToCart(itemId) {
                const item = this.config.menuItems.find(item => item.id === itemId);
                if (!item) return;

                const cartItem = this.config.cart.find(item => item.id === itemId);
                if (cartItem) {
                    cartItem.quantity++;
                } else {
                    this.config.cart.push({...item, quantity: 1});
                }

                // 保存到本地存储
                localStorage.setItem('cart', JSON.stringify(this.config.cart));
                
                // 重新渲染购物车
                this.renderCart();
                
                // 显示购物车侧边栏
                document.getElementById('cart-sidebar').classList.remove('translate-x-full');
                
                // 添加脉动动画
                const cartBtn = document.getElementById('cart-btn');
                cartBtn.classList.add('cart-pulse');
                setTimeout(() => cartBtn.classList.remove('cart-pulse'), 500);
            },

            // 更新购物车商品数量
            updateCartItemQuantity(itemId, change) {
                const cartItem = this.config.cart.find(item => item.id === itemId);
                if (!cartItem) return;

                cartItem.quantity += change;

                if (cartItem.quantity <= 0) {
                    // 从购物车中移除
                    this.config.cart = this.config.cart.filter(item => item.id !== itemId);
                }

                // 保存到本地存储
                localStorage.setItem('cart', JSON.stringify(this.config.cart));
                
                // 重新渲染购物车
                this.renderCart();
            },

            // 提交订单
            submitOrder() {
                const tableNumber = document.getElementById('table-number').value;
                if (!tableNumber) {
                    alert('请输入桌号');
                    return;
                }

                const order = {
                    id: Date.now(),
                    customerId: this.config.customerId,
                    tableNumber: tableNumber,
                    notes: document.getElementById('order-notes').value,
                    items: [...this.config.cart],
                    total: this.config.cart.reduce((sum, item) => sum + item.price * item.quantity, 0),
                    status: '待处理',
                    createdAt: new Date().toLocaleString()
                };

                // 添加到订单列表
                this.config.orders.unshift(order);
                localStorage.setItem('orders', JSON.stringify(this.config.orders));

                // 清空购物车
                this.config.cart = [];
                localStorage.setItem('cart', '[]');

                // 更新界面
                this.renderCart();
                document.getElementById('checkout-modal').classList.add('hidden');
                document.getElementById('table-number').value = '';
                document.getElementById('order-notes').value = '';

                alert('订单提交成功！');
            },

            // 完成订单
            completeOrder(orderId) {
                const order = this.config.orders.find(order => order.id === orderId);
                if (order) {
                    order.status = '已完成';
                    localStorage.setItem('orders', JSON.stringify(this.config.orders));
                    this.renderAdminOrders();
                }
            },

            deleteDish(itemId) {
                if (confirm('确定要删除这个菜品吗？')) {
                    this.config.menuItems = this.config.menuItems.filter(item => item.id !== itemId);
                    localStorage.setItem('menuItems', JSON.stringify(this.config.menuItems));
                    this.renderDishList();
                    this.renderMenu();
                }

            showEditDishModal(itemId) {
                const item = this.config.menuItems.find(item => item.id === itemId);
                if (!item) return;

                document.getElementById('edit-dish-id').value = item.id;
                document.getElementById('edit-dish-name').value = item.name;
                document.getElementById('edit-dish-price').value = item.price;
                document.getElementById('edit-dish-category').value = item.category;
                document.getElementById('edit-dish-description').value = item.description;
                document.getElementById('edit-dish-image-url').value = item.image;
                document.getElementById('edit-dish-image-upload').value = '';
                document.getElementById('edit-dish-image-url').classList.add('hidden');

                document.getElementById('edit-dish-modal').classList.remove('hidden');
            },

            // 保存编辑后的菜品
            saveEditDish(e) {
                e.preventDefault();
                const itemId = parseInt(document.getElementById('edit-dish-id').value);
                const item = this.config.menuItems.find(item => item.id === itemId);
                if (!item) return;

                const imageUpload = document.getElementById('edit-dish-image-upload');
                const imageUrl = document.getElementById('edit-dish-image-url').value;

                item.name = document.getElementById('edit-dish-name').value;
                item.price = parseFloat(document.getElementById('edit-dish-price').value);
                item.category = document.getElementById('edit-dish-category').value;
                item.description = document.getElementById('edit-dish-description').value;

                // 处理图片更新
                if (imageUpload.files.length > 0) {
                    const file = imageUpload.files[0];
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        item.image = e.target.result;
                        localStorage.setItem('menuItems', JSON.stringify(this.config.menuItems));
                        this.renderDishList();
                        this.renderMenu(); // 更新顾客端菜单
                        document.getElementById('edit-dish-modal').classList.add('hidden');
                        alert('菜品修改成功！');
                    };
                    reader.readAsDataURL(file);
                } else if (imageUrl) {
                    item.image = imageUrl;
                    localStorage.setItem('menuItems', JSON.stringify(this.config.menuItems));
                    this.renderDishList();
                    this.renderMenu(); // 更新顾客端菜单
                    document.getElementById('edit-dish-modal').classList.add('hidden');
                    alert('菜品修改成功！');
                } else {
                    alert('请上传图片或输入图片URL');
                }
            },

            showAddDishModal() {
                document.getElementById('add-dish-form').reset();
                document.getElementById('add-dish-image-url').classList.add('hidden');
                document.getElementById('add-dish-modal').classList.remove('hidden');

            // 添加菜品
            addDish(e) {
                e.preventDefault();
                const name = document.getElementById('add-dish-name').value;
                const price = parseFloat(document.getElementById('add-dish-price').value);
                const category = document.getElementById('add-dish-category').value;
                const description = document.getElementById('add-dish-description').value;
                const imageUpload = document.getElementById('add-dish-image-upload');
                const imageUrl = document.getElementById('add-dish-image-url').value;

                let image = '';
                
                // 处理图片上传
                if (imageUpload.files.length > 0) {
                    const file = imageUpload.files[0];
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const newDish = {
                            id: Date.now(),
                            name,
                            price,

                            description,
                            image: e.target.result

                        id: Date.now(),

                        category,
                        description,
                        image: imageUrl

                    this.config.menuItems.push(newDish);
                    localStorage.setItem('menuItems', JSON.stringify(this.config.menuItems));
                    this.renderDishList();
                    this.renderMenu();

                                return;
                            }
                            this.config.categories[index] = newName.trim();
                            localStorage.setItem('categories', JSON.stringify(this.config.categories));
                            this.renderCategoryList();
                            this.updateCategorySelectors();
                            this.renderCategoryButtons();
                            alert('分类修改成功！');
                        }
                    }

                    // 删除分类
                    if (e.target.classList.contains('delete-category-btn')) {
                        const index = parseInt(e.target.dataset.index);
                        const category = this.config.categories[index];
                        
                        // 检查是否有菜品使用该分类
                        const dishesInCategory = this.config.menuItems.filter(item => item.category === category);
                        if (dishesInCategory.length > 0) {
                            alert(`无法删除分类"${category}"，还有${dishesInCategory.length}个菜品使用该分类`);
                            return;
                        }
                        
                        if (confirm(`确定要删除分类"${category}"吗？`)) {
                            this.config.categories.splice(index, 1);
                            localStorage.setItem('categories', JSON.stringify(this.config.categories));
                            this.renderCategoryList();
                            this.updateCategorySelectors();
                            this.renderCategoryButtons();
                            alert('分类删除成功！');
                        }
                    }

                    // 添加到购物车
                    if (e.target.classList.contains('add-to-cart')) {
                        const itemId = parseInt(e.target.dataset.id);
                        this.addToCart(itemId);
                    }

                    // 减少购物车数量
                    if (e.target.classList.contains('decrease-btn')) {
                        const itemId = parseInt(e.target.dataset.id);
                        this.updateCartItemQuantity(itemId, -1);
                    }

                    // 增加购物车数量
                    if (e.target.classList.contains('increase-btn')) {
                        const itemId = parseInt(e.target.dataset.id);
                        this.updateCartItemQuantity(itemId, 1);
                    }

                    // 完成订单
                    if (e.target.classList.contains('complete-order-btn')) {
                        const orderId = parseInt(e.target.dataset.id);
                        this.completeOrder(orderId);
                    }

                    // 编辑菜品
                    if (e.target.classList.contains('edit-dish-btn')) {
                        const itemId = parseInt(e.target.dataset.id);
                        this.showEditDishModal(itemId);
                    }

                    // 删除菜品
                    if (e.target.classList.contains('delete-dish-btn')) {
                        const itemId = parseInt(e.target.dataset.id);
                        this.deleteDish(itemId);
                    }
                });
            }
        };

        // 页面加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            OrderingApp.init();
        });
    </script>
</body>
</html>
